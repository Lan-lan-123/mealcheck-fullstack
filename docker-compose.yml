services:
  redis:
    image: redis:7-alpine
    container_name: mealcheck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mealcheck_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mealcheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mealcheck
      POSTGRES_USER: mealcheck
      POSTGRES_PASSWORD: mealcheck123
    ports:
      - "5432:5432"
    volumes:
      - mealcheck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealcheck -d mealcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    profiles:
      - fullstack
    build:
      context: ./backend
    container_name: mealcheck-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mealcheck
      SPRING_DATASOURCE_USERNAME: mealcheck
      SPRING_DATASOURCE_PASSWORD: mealcheck123
      MEALCHECK_DB_MAX_POOL_SIZE: ${MEALCHECK_DB_MAX_POOL_SIZE:-12}
      MEALCHECK_DB_MIN_IDLE: ${MEALCHECK_DB_MIN_IDLE:-2}
      MEALCHECK_DB_CONNECTION_TIMEOUT_MILLIS: ${MEALCHECK_DB_CONNECTION_TIMEOUT_MILLIS:-2000}
      MEALCHECK_DB_VALIDATION_TIMEOUT_MILLIS: ${MEALCHECK_DB_VALIDATION_TIMEOUT_MILLIS:-1000}
      MEALCHECK_DB_QUERY_TIMEOUT: ${MEALCHECK_DB_QUERY_TIMEOUT:-3s}
      MEALCHECK_DB_QUERY_TIMEOUT_MILLIS: ${MEALCHECK_DB_QUERY_TIMEOUT_MILLIS:-3000}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MEALCHECK_UPLOAD_DIR: /app/uploads
      MEALCHECK_UPLOAD_MAX_INPUT_BYTES: ${MEALCHECK_UPLOAD_MAX_INPUT_BYTES:-10485760}
      MEALCHECK_UPLOAD_MAX_WIDTH: ${MEALCHECK_UPLOAD_MAX_WIDTH:-4096}
      MEALCHECK_UPLOAD_MAX_HEIGHT: ${MEALCHECK_UPLOAD_MAX_HEIGHT:-4096}
      MEALCHECK_UPLOAD_MAX_PIXELS: ${MEALCHECK_UPLOAD_MAX_PIXELS:-16777216}
      MEALCHECK_UPLOAD_NORMALIZED_MAX_EDGE: ${MEALCHECK_UPLOAD_NORMALIZED_MAX_EDGE:-2560}
      MEALCHECK_UPLOAD_JPEG_QUALITY: ${MEALCHECK_UPLOAD_JPEG_QUALITY:-0.90}
      MEALCHECK_UPLOAD_ORPHAN_CLEANUP_ENABLED: ${MEALCHECK_UPLOAD_ORPHAN_CLEANUP_ENABLED:-true}
      MEALCHECK_UPLOAD_ORPHAN_CLEANUP_CRON: ${MEALCHECK_UPLOAD_ORPHAN_CLEANUP_CRON:-0 30 3 * * *}
      MEALCHECK_UPLOAD_ORPHAN_GRACE_HOURS: ${MEALCHECK_UPLOAD_ORPHAN_GRACE_HOURS:-24}
      MEALCHECK_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MEALCHECK_AI_API_KEY: ${MEALCHECK_AI_API_KEY:-}
      MEALCHECK_AI_BASE_URL: ${MEALCHECK_AI_BASE_URL:-}
      MEALCHECK_AI_MODEL: ${MEALCHECK_AI_MODEL:-qwen2.5-vl-3b-instruct}
      MEALCHECK_KNOWLEDGE_EMBEDDING_API_KEY: ${MEALCHECK_KNOWLEDGE_EMBEDDING_API_KEY:-}
      MEALCHECK_KNOWLEDGE_EMBEDDING_BASE_URL: ${MEALCHECK_KNOWLEDGE_EMBEDDING_BASE_URL:-}
      MEALCHECK_KNOWLEDGE_EMBEDDING_MODEL: ${MEALCHECK_KNOWLEDGE_EMBEDDING_MODEL:-}
      MEALCHECK_KNOWLEDGE_EMBEDDING_DIM: ${MEALCHECK_KNOWLEDGE_EMBEDDING_DIM:-512}
      MEALCHECK_KNOWLEDGE_VECTOR_STORAGE: ${MEALCHECK_KNOWLEDGE_VECTOR_STORAGE:-halfvec}
      MEALCHECK_KNOWLEDGE_VECTOR_WEIGHT: ${MEALCHECK_KNOWLEDGE_VECTOR_WEIGHT:-0.65}
      MEALCHECK_KNOWLEDGE_KEYWORD_WEIGHT: ${MEALCHECK_KNOWLEDGE_KEYWORD_WEIGHT:-0.25}
      MEALCHECK_KNOWLEDGE_CATEGORY_WEIGHT: ${MEALCHECK_KNOWLEDGE_CATEGORY_WEIGHT:-0.10}
      MEALCHECK_KNOWLEDGE_RRF_K: ${MEALCHECK_KNOWLEDGE_RRF_K:-60}
      MEALCHECK_KNOWLEDGE_RERANK_ENABLED: ${MEALCHECK_KNOWLEDGE_RERANK_ENABLED:-false}
      MEALCHECK_KNOWLEDGE_RERANK_URL: ${MEALCHECK_KNOWLEDGE_RERANK_URL:-}
      MEALCHECK_KNOWLEDGE_RERANK_API_KEY: ${MEALCHECK_KNOWLEDGE_RERANK_API_KEY:-}
      MEALCHECK_KNOWLEDGE_RERANK_MODEL: ${MEALCHECK_KNOWLEDGE_RERANK_MODEL:-}
      MEALCHECK_KNOWLEDGE_RERANK_CANDIDATE_MULTIPLIER: ${MEALCHECK_KNOWLEDGE_RERANK_CANDIDATE_MULTIPLIER:-4}
      MEALCHECK_KNOWLEDGE_RERANK_MODEL_WEIGHT: ${MEALCHECK_KNOWLEDGE_RERANK_MODEL_WEIGHT:-0.75}
      MEALCHECK_KNOWLEDGE_RERANK_TIMEOUT_SECONDS: ${MEALCHECK_KNOWLEDGE_RERANK_TIMEOUT_SECONDS:-10}
      MEALCHECK_KNOWLEDGE_RERANKER_MIN_SCORE: ${MEALCHECK_KNOWLEDGE_RERANKER_MIN_SCORE:-0.20}
      MEALCHECK_KNOWLEDGE_RESULT_FILTER_ENABLED: ${MEALCHECK_KNOWLEDGE_RESULT_FILTER_ENABLED:-true}
      MEALCHECK_KNOWLEDGE_RESULT_MIN_SCORE: ${MEALCHECK_KNOWLEDGE_RESULT_MIN_SCORE:-0.35}
      MEALCHECK_KNOWLEDGE_RESULT_RELATIVE_SCORE: ${MEALCHECK_KNOWLEDGE_RESULT_RELATIVE_SCORE:-0.60}
      MEALCHECK_KNOWLEDGE_RESULT_DEDUP_SIMILARITY: ${MEALCHECK_KNOWLEDGE_RESULT_DEDUP_SIMILARITY:-0.88}
      MEALCHECK_KNOWLEDGE_RESULT_CANDIDATE_MULTIPLIER: ${MEALCHECK_KNOWLEDGE_RESULT_CANDIDATE_MULTIPLIER:-4}
      MEALCHECK_KNOWLEDGE_CHUNK_MIN_TOKENS: ${MEALCHECK_KNOWLEDGE_CHUNK_MIN_TOKENS:-300}
      MEALCHECK_KNOWLEDGE_CHUNK_MAX_TOKENS: ${MEALCHECK_KNOWLEDGE_CHUNK_MAX_TOKENS:-500}
      MEALCHECK_KNOWLEDGE_CHUNK_OVERLAP_TOKENS: ${MEALCHECK_KNOWLEDGE_CHUNK_OVERLAP_TOKENS:-50}
      MEALCHECK_KNOWLEDGE_SPLITTER_STRATEGY: ${MEALCHECK_KNOWLEDGE_SPLITTER_STRATEGY:-recursive-markdown}
      MEALCHECK_KNOWLEDGE_SOURCE_VERSION: ${MEALCHECK_KNOWLEDGE_SOURCE_VERSION:-v2-recursive}
      MEALCHECK_KNOWLEDGE_BENCHMARK_REGRESSION_TOLERANCE: ${MEALCHECK_KNOWLEDGE_BENCHMARK_REGRESSION_TOLERANCE:-0.02}
      MEALCHECK_RATE_LIMIT_ASSISTANT_CAPACITY: ${MEALCHECK_RATE_LIMIT_ASSISTANT_CAPACITY:-5}
      MEALCHECK_RATE_LIMIT_ASSISTANT_REFILL_TOKENS: ${MEALCHECK_RATE_LIMIT_ASSISTANT_REFILL_TOKENS:-1}
      MEALCHECK_RATE_LIMIT_ASSISTANT_REFILL_PERIOD_SECONDS: ${MEALCHECK_RATE_LIMIT_ASSISTANT_REFILL_PERIOD_SECONDS:-3}
      MEALCHECK_RATE_LIMIT_ASSISTANT_REQUEST_COST: ${MEALCHECK_RATE_LIMIT_ASSISTANT_REQUEST_COST:-1}
      MEALCHECK_RATE_LIMIT_MEAL_CAPACITY: ${MEALCHECK_RATE_LIMIT_MEAL_CAPACITY:-3}
      MEALCHECK_RATE_LIMIT_MEAL_REFILL_TOKENS: ${MEALCHECK_RATE_LIMIT_MEAL_REFILL_TOKENS:-1}
      MEALCHECK_RATE_LIMIT_MEAL_REFILL_PERIOD_SECONDS: ${MEALCHECK_RATE_LIMIT_MEAL_REFILL_PERIOD_SECONDS:-6}
      MEALCHECK_RATE_LIMIT_MEAL_REQUEST_COST: ${MEALCHECK_RATE_LIMIT_MEAL_REQUEST_COST:-1}
      MEALCHECK_WEEKLY_REPORT_BATCH_SIZE: ${MEALCHECK_WEEKLY_REPORT_BATCH_SIZE:-100}
      MEALCHECK_WEEKLY_REPORT_EXECUTOR_CORE_POOL_SIZE: ${MEALCHECK_WEEKLY_REPORT_EXECUTOR_CORE_POOL_SIZE:-2}
      MEALCHECK_WEEKLY_REPORT_EXECUTOR_MAX_POOL_SIZE: ${MEALCHECK_WEEKLY_REPORT_EXECUTOR_MAX_POOL_SIZE:-4}
      MEALCHECK_WEEKLY_REPORT_EXECUTOR_QUEUE_CAPACITY: ${MEALCHECK_WEEKLY_REPORT_EXECUTOR_QUEUE_CAPACITY:-20}
      MEALCHECK_WEEKLY_REPORT_AGENT_EXECUTOR_CORE_POOL_SIZE: ${MEALCHECK_WEEKLY_REPORT_AGENT_EXECUTOR_CORE_POOL_SIZE:-2}
      MEALCHECK_WEEKLY_REPORT_AGENT_EXECUTOR_MAX_POOL_SIZE: ${MEALCHECK_WEEKLY_REPORT_AGENT_EXECUTOR_MAX_POOL_SIZE:-4}
      MEALCHECK_WEEKLY_REPORT_AGENT_EXECUTOR_QUEUE_CAPACITY: ${MEALCHECK_WEEKLY_REPORT_AGENT_EXECUTOR_QUEUE_CAPACITY:-20}
      MEALCHECK_WEEKLY_REPORT_WORKER_BATCH_SIZE: ${MEALCHECK_WEEKLY_REPORT_WORKER_BATCH_SIZE:-4}
      MEALCHECK_WEEKLY_REPORT_MAX_ATTEMPTS: ${MEALCHECK_WEEKLY_REPORT_MAX_ATTEMPTS:-3}
      MEALCHECK_WEEKLY_REPORT_STALE_LEASE_SECONDS: ${MEALCHECK_WEEKLY_REPORT_STALE_LEASE_SECONDS:-600}
      MEALCHECK_WEEKLY_REPORT_WORKER_DELAY_MILLIS: ${MEALCHECK_WEEKLY_REPORT_WORKER_DELAY_MILLIS:-5000}
      MEALCHECK_WEEKLY_REPORT_MULTI_AGENT_ENABLED: ${MEALCHECK_WEEKLY_REPORT_MULTI_AGENT_ENABLED:-true}
      MEALCHECK_WEEKLY_REPORT_MAX_REVIEW_REVISIONS: ${MEALCHECK_WEEKLY_REPORT_MAX_REVIEW_REVISIONS:-1}
      MEALCHECK_WEEKLY_REPORT_RAG_LIMIT: ${MEALCHECK_WEEKLY_REPORT_RAG_LIMIT:-5}
      MEALCHECK_WEEKLY_REPORT_AGENT_TIMEOUT_SECONDS: ${MEALCHECK_WEEKLY_REPORT_AGENT_TIMEOUT_SECONDS:-30}
      MEALCHECK_MCP_ENABLED: ${MEALCHECK_MCP_ENABLED:-true}
      MEALCHECK_MCP_ENDPOINT: ${MEALCHECK_MCP_ENDPOINT:-/mcp}
      MEALCHECK_ASSISTANT_FUNCTION_CALLING_ENABLED: ${MEALCHECK_ASSISTANT_FUNCTION_CALLING_ENABLED:-false}
      MEALCHECK_ASSISTANT_FUNCTION_CALLING_MAX_TOOL_ROUNDS: ${MEALCHECK_ASSISTANT_FUNCTION_CALLING_MAX_TOOL_ROUNDS:-3}
      MEALCHECK_ASSISTANT_FUNCTION_CALLING_MAX_TOOL_CALLS: ${MEALCHECK_ASSISTANT_FUNCTION_CALLING_MAX_TOOL_CALLS:-6}
      MEALCHECK_ASSISTANT_FUNCTION_CALLING_TOTAL_TIMEOUT_SECONDS: ${MEALCHECK_ASSISTANT_FUNCTION_CALLING_TOTAL_TIMEOUT_SECONDS:-30}
      MEALCHECK_ASSISTANT_MEMORY_HISTORY_TOKEN_BUDGET: ${MEALCHECK_ASSISTANT_MEMORY_HISTORY_TOKEN_BUDGET:-1200}
      MEALCHECK_ASSISTANT_MEMORY_RECENT_MESSAGES: ${MEALCHECK_ASSISTANT_MEMORY_RECENT_MESSAGES:-6}
      MEALCHECK_ASSISTANT_MEMORY_SUMMARY_MAX_TOKENS: ${MEALCHECK_ASSISTANT_MEMORY_SUMMARY_MAX_TOKENS:-500}
      MEALCHECK_ASSISTANT_MEMORY_RELEVANT_MESSAGES: ${MEALCHECK_ASSISTANT_MEMORY_RELEVANT_MESSAGES:-4}
      MEALCHECK_ASSISTANT_MEMORY_RECENT_DATABASE_MESSAGES: ${MEALCHECK_ASSISTANT_MEMORY_RECENT_DATABASE_MESSAGES:-40}
      MEALCHECK_ASSISTANT_MEMORY_SUMMARY_BATCH_MESSAGES: ${MEALCHECK_ASSISTANT_MEMORY_SUMMARY_BATCH_MESSAGES:-100}
      MEALCHECK_ASSISTANT_HTTP_POOL_SIZE: ${MEALCHECK_ASSISTANT_HTTP_POOL_SIZE:-8}
      MEALCHECK_ASSISTANT_HTTP_QUEUE_CAPACITY: ${MEALCHECK_ASSISTANT_HTTP_QUEUE_CAPACITY:-16}
      MEALCHECK_ASSISTANT_DB_POOL_SIZE: ${MEALCHECK_ASSISTANT_DB_POOL_SIZE:-6}
      MEALCHECK_ASSISTANT_DB_QUEUE_CAPACITY: ${MEALCHECK_ASSISTANT_DB_QUEUE_CAPACITY:-16}
      MEALCHECK_ASSISTANT_RAG_POOL_SIZE: ${MEALCHECK_ASSISTANT_RAG_POOL_SIZE:-4}
      MEALCHECK_ASSISTANT_RAG_QUEUE_CAPACITY: ${MEALCHECK_ASSISTANT_RAG_QUEUE_CAPACITY:-8}
      MEALCHECK_ASSISTANT_BACKGROUND_POOL_SIZE: ${MEALCHECK_ASSISTANT_BACKGROUND_POOL_SIZE:-2}
      MEALCHECK_ASSISTANT_BACKGROUND_QUEUE_CAPACITY: ${MEALCHECK_ASSISTANT_BACKGROUND_QUEUE_CAPACITY:-16}
      MEALCHECK_ASSISTANT_TOOLS_TIMEOUT_MILLIS: ${MEALCHECK_ASSISTANT_TOOLS_TIMEOUT_MILLIS:-2500}
      MEALCHECK_ASSISTANT_TOOLS_TOTAL_TIMEOUT_MILLIS: ${MEALCHECK_ASSISTANT_TOOLS_TOTAL_TIMEOUT_MILLIS:-3000}
      MEALCHECK_REMOTE_MAX_ATTEMPTS: ${MEALCHECK_REMOTE_MAX_ATTEMPTS:-2}
      MEALCHECK_REMOTE_INITIAL_BACKOFF_MILLIS: ${MEALCHECK_REMOTE_INITIAL_BACKOFF_MILLIS:-200}
      MEALCHECK_REMOTE_FAILURE_THRESHOLD: ${MEALCHECK_REMOTE_FAILURE_THRESHOLD:-5}
      MEALCHECK_REMOTE_OPEN_DURATION_SECONDS: ${MEALCHECK_REMOTE_OPEN_DURATION_SECONDS:-30}
      MEALCHECK_REMOTE_MAX_CONCURRENT_CALLS: ${MEALCHECK_REMOTE_MAX_CONCURRENT_CALLS:-8}
    ports:
      - "8080:8080"
    volumes:
      - mealcheck_uploads:/app/uploads

  frontend:
    profiles:
      - fullstack
    build:
      context: ./frontend
    container_name: mealcheck-frontend
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"

volumes:
  mealcheck_pgdata:
  mealcheck_redisdata:
  mealcheck_uploads:
