map $http_x_forwarded_proto $mealcheck_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# The published container port is bound to host loopback. Trust only the Docker
# edge gateway used by the host TLS proxy (docker-compose.prod.yml).
geo $realip_remote_addr $mealcheck_trusted_edge {
    default 0;
    10.203.0.1/32 1;
    127.0.0.1/32 1;
    ::1/128 1;
}

map $mealcheck_trusted_edge $mealcheck_safe_proto {
    default $scheme;
    1 $mealcheck_forwarded_proto;
}

# Only multipart requests share this global limit; reads do not consume slots.
# 20 * 12 MiB fits the default 256 MiB request-body temporary filesystem.
map $http_content_type $mealcheck_upload_key {
    default "";
    ~*^multipart/ "uploads";
}
limit_conn_zone $mealcheck_upload_key zone=mealcheck_uploads:1m;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mealcheck_backend http://backend:8080;

    set_real_ip_from 10.203.0.1;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    location /api/ {
        limit_conn mealcheck_uploads 20;
        limit_conn_status 429;
        error_page 429 = @upload_busy;
        proxy_pass $mealcheck_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $mealcheck_safe_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location @upload_busy {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"status":429,"code":"UPLOAD_BUSY","message":"上传入口繁忙，请稍后重试。"}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
