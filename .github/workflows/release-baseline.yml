name: release-baseline

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version recorded in the manifest (does not publish a release)
        required: true
        default: '2.0.0'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: grafana/setup-k6-action@v1
      - name: Install fixture and proxy dependencies
        run: |
          python -m pip install -r tools/requirements-ci.txt
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Verify the committed candidate and retain its images
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: python deploy/scripts/release_baseline.py --version "$CANDIDATE_VERSION" --install-browser --require-proxy
      - name: Retain candidate identity and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-baseline-${{ github.sha }}
          retention-days: 14
          path: |
            logs/deploy/release-baseline/*/manifest.json*
            logs/deploy/release-baseline/*/source.zip
            logs/deploy/release-baseline/*/images.tar
            logs/deploy/release-baseline/*/logs/
            logs/deploy/release-baseline/*/reports/
            logs/deploy/release-baseline/*/crash/
            logs/deploy/release-baseline/*/capacity/acceptance.json
            logs/deploy/release-baseline/*/stack-restored/verification.json
            logs/deploy/release-baseline/*/full-schema/restored/verification.json
            logs/deploy/release-baseline/*/assistant-cluster/verification.json
            logs/deploy/release-baseline/*/assistant-cluster/progress.json
            logs/deploy/release-baseline/*/assistant-cluster/*.log
            logs/deploy/release-baseline/*/knowledge-cluster/verification.json
            logs/deploy/release-baseline/*/knowledge-cluster/progress.json
            logs/deploy/release-baseline/*/knowledge-cluster/*.log
