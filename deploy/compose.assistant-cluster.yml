# Isolated acceptance only. No production env files, named volumes, or remote model endpoints.
x-backend: &backend
  image: eclipse-temurin:17-jre
  user: "10001:10001"
  command: [java, -Xms96m, -Xmx384m, -jar, /app/app.jar]
  volumes:
    - type: bind
      source: ${CLUSTER_TEST_JAR:?Set CLUSTER_TEST_JAR to the fixed tested JAR}
      target: /app/app.jar
      read_only: true
      bind: {create_host_path: false}
  tmpfs: [/tmp]
  mem_limit: 640m
  environment:
    SPRING_PROFILES_ACTIVE: cluster-test
    SPRING_CONFIG_ADDITIONAL_LOCATION: classpath:/application-prod.yml
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mealcheck
    SPRING_DATASOURCE_USERNAME: mealcheck
    SPRING_DATASOURCE_PASSWORD: cluster-only-password
    SPRING_REDIS_HOST: redis
    SPRING_REDIS_PASSWORD: ""
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_USERNAME: mealcheck
    SPRING_RABBITMQ_PASSWORD: cluster-only-password
    MEALCHECK_JWT_SECRET: cluster-test-only-jwt-secret-longer-than-forty-eight-bytes
    MEALCHECK_CORS_ALLOWED_ORIGINS: http://localhost
    MANAGEMENT_SERVER_PORT: 8080
    MEALCHECK_UPLOAD_DIR: /tmp/uploads
    MEALCHECK_MCP_ENABLED: "false"
    MEALCHECK_AI_API_KEY: cluster-test-only
    MEALCHECK_AI_BASE_URL: http://model-stub:9082/v1
    MEALCHECK_AI_MODEL: cluster-stub
    MEALCHECK_AI_DAILY_CALLS: "1000"
    MEALCHECK_AI_OPERATION_TIMEOUT_SECONDS: "40"
    MEALCHECK_RATE_LIMIT_REGISTRATION_CAPACITY: "100"
    MEALCHECK_RATE_LIMIT_CAPTCHA_CAPACITY: "500"
    MEALCHECK_RATE_LIMIT_ASSISTANT_CAPACITY: "200"
    MEALCHECK_WEEKLY_REPORT_SCHEDULER_ENABLED: "false"
    MEALCHECK_ASSISTANT_DELIVERY_WORKERS: "1"
    MEALCHECK_ASSISTANT_DELIVERY_QUEUE_CAPACITY: "2"
    MEALCHECK_ASSISTANT_DELIVERY_LEASE_SECONDS: "6"
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: mealcheck, POSTGRES_USER: mealcheck, POSTGRES_PASSWORD: cluster-only-password}
    healthcheck: {test: [CMD-SHELL, "pg_isready -U mealcheck -d mealcheck"], interval: 2s, timeout: 2s, retries: 30}
  redis:
    image: redis:7.4-alpine
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 2s, retries: 30}
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: mealcheck, RABBITMQ_DEFAULT_PASS: cluster-only-password}
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 3s, timeout: 5s, retries: 30}
  model-stub:
    image: python:3.12-alpine
    command: [python, /stub/model_stub.py]
    volumes: ["./scripts/model_stub.py:/stub/model_stub.py:ro"]
    environment: {MODEL_STUB_DELAY_SECONDS: "0.05"}
  backend-a:
    <<: *backend
  backend-b:
    <<: *backend
  acceptance-proxy:
    image: python:3.12-alpine
    command: [python, /fixture/assistant_cluster_proxy.py]
    volumes: ["./scripts/assistant_cluster_proxy.py:/fixture/assistant_cluster_proxy.py:ro"]
    networks: [default, acceptance-edge]
    ports:
      - "127.0.0.1:${CLUSTER_PORT_A:-18191}:18080"
      - "127.0.0.1:${CLUSTER_PORT_B:-18192}:18081"
      - "127.0.0.1:${CLUSTER_PORT_STUB:-19892}:19082"
networks:
  default:
    internal: true
  acceptance-edge: {}
