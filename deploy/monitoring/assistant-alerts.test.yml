rule_files:
  - mealcheck-alerts.yml
evaluation_interval: 10s
tests:
  - interval: 10s
    input_series:
      - series: 'mealcheck_assistant_coordination_healthy{instance="failed"}'
        values: '0+0x5 1+0x10'
      - series: 'mealcheck_assistant_coordination_last_success_timestamp_seconds{instance="failed"}'
        values: '0+10x16'
      - series: 'mealcheck_assistant_coordination_healthy{instance="stalled"}'
        values: '1+0x16'
      - series: 'mealcheck_assistant_coordination_last_success_timestamp_seconds{instance="stalled"}'
        values: '0+0x11 120+10x4'
    alert_rule_test:
      - eval_time: 30s
        alertname: MealCheckAssistantCoordinationUnhealthy
        exp_alerts:
          - exp_labels: {instance: failed, severity: warning, service: mealcheck}
            exp_annotations:
              summary: "助手共享任务协调失败或心跳维护过期"
              description: "检查数据库连接与锁等待。租约失效会阻止旧执行提交，任务不会自动重新调用模型。"
      - eval_time: 60s
        alertname: MealCheckAssistantCoordinationUnhealthy
        exp_alerts: []
      - eval_time: 90s
        alertname: MealCheckAssistantCoordinationUnhealthy
        exp_alerts:
          - exp_labels: {instance: stalled, severity: warning, service: mealcheck}
            exp_annotations:
              summary: "助手共享任务协调失败或心跳维护过期"
              description: "检查数据库连接与锁等待。租约失效会阻止旧执行提交，任务不会自动重新调用模型。"
      - eval_time: 130s
        alertname: MealCheckAssistantCoordinationUnhealthy
        exp_alerts: []
