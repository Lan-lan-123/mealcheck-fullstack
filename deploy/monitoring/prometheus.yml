global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/mealcheck-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: mealcheck
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9091]
  - job_name: backup
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
