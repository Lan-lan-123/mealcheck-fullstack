# Use the exact images built for this candidate; never rebuild during acceptance.
services:
  postgres:
    image: ${MEALCHECK_RELEASE_POSTGRES_IMAGE:?Set candidate PostgreSQL image}
  backend:
    image: ${MEALCHECK_RELEASE_BACKEND_IMAGE:?Set candidate backend image}
    build: !reset null
  frontend:
    image: ${MEALCHECK_RELEASE_FRONTEND_IMAGE:?Set candidate frontend image}
    build: !reset null

# Scratch stacks must coexist with retained production/capacity networks.
networks:
  edge:
    ipam:
      config: !reset []
